<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Restricted Area</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-analytics.js"></script>

  <style>
    body {
      font-family: sans-serif;
      background-color: #111;
      color: #eee;
      padding: 2rem;
    }

    input,
    button {
      display: block;
      margin: 0.5rem 0;
      padding: 0.5rem;
      font-size: 1rem;
      width: 100%;
      max-width: 300px;
    }

    #protected-content {
      display: none;
    }

    #error-message {
      color: red;
      margin-top: 1rem;
    }

    .toggle-mode {
      cursor: pointer;
      color: #0af;
      text-decoration: underline;
      margin-top: 1rem;
    }
  </style>
</head>

<body>

  <div id="auth-container">
    <h2 id="form-title">Login</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="auth-button" onclick="handleAuth()">Login</button>
    <p class="toggle-mode" onclick="toggleMode()">Don't have an account? Sign up</p>
    <p id="error-message"></p>
  </div>

  <div id="protected-content">
    <h1>Welcome to the Secret Lair</h1>
    <p>You’re now behind the digital velvet rope.</p>
    <button onclick="logout()">Logout</button>
  </div>

  <script>

    const firebaseConfig = {
      apiKey: "AIzaSyCA3Q3TlnldrdQ_u6gQfdpj4kMul0PmQ8c",
      authDomain: "tmj-site.firebaseapp.com",
      projectId: "tmj-site",
      storageBucket: "tmj-site.firebasestorage.app",
      messagingSenderId: "936738367249",
      appId: "1:936738367249:web:d6aac37ed4183da0968eb0",
      measurementId: "G-HZPCNMXH51"
    };


    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = firebase.auth();

    let isSignup = false;

    function toggleMode() {
      isSignup = !isSignup;
      document.getElementById("form-title").innerText = isSignup ? "Sign Up" : "Login";
      document.getElementById("auth-button").innerText = isSignup ? "Sign Up" : "Login";
      document.querySelector(".toggle-mode").innerText = isSignup ?
        "Already have an account? Login" :
        "Don't have an account? Sign up";
      document.getElementById("error-message").innerText = "";
    }

    function handleAuth() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorMsg = document.getElementById("error-message");

      if (!email || !password) {
        errorMsg.innerText = "Both fields are required.";
        return;
      }

      if (isSignup) {
        auth.createUserWithEmailAndPassword(email, password)
          .catch(err => errorMsg.innerText = err.message);
      } else {
        auth.signInWithEmailAndPassword(email, password)
          .catch(err => errorMsg.innerText = err.message);
      }
    }

    function logout() {
      auth.signOut();
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById("auth-container").style.display = "none";
        document.getElementById("protected-content").style.display = "block";
      } else {
        document.getElementById("auth-container").style.display = "block";
        document.getElementById("protected-content").style.display = "none";
      }
    });
  </script>

</body>

</html>
